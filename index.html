<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Guess the Famous Phrase</title>
<style>
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;min-height:100vh;font-family:"Segoe UI",Arial,sans-serif;background:linear-gradient(145deg,#10233f,#07111f 70%);color:#fff;display:flex;justify-content:center;align-items:center;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}.game{width:min(950px,100%);min-height:590px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:24px;padding:36px;box-shadow:0 24px 70px rgba(0,0,0,.38);text-align:center}h1{margin:0 0 8px;font-size:clamp(30px,5vw,48px)}.subtitle{color:#c7d8ef;margin-bottom:48px;font-size:18px}.phrase-area{min-height:145px;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:14px;margin-bottom:46px}.slot{height:62px;min-width:115px;padding:0 14px;border-bottom:4px solid #7eb8ff;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:700;color:#fff}.word-bank-title{color:#a9c8ed;margin-bottom:16px;font-size:15px;text-transform:uppercase;letter-spacing:2px}#wordBank{display:flex;flex-wrap:wrap;justify-content:center;gap:15px;min-height:75px}.word{border:0;border-radius:14px;padding:15px 24px;font-size:21px;font-weight:700;color:#10233f;background:#f4f8ff;cursor:pointer;box-shadow:0 5px 0 #9db5cc}.word:hover:not(:disabled){background:#dcecff}.word:disabled{opacity:.16;cursor:default;box-shadow:none}.wrong{animation:shake .28s linear;background:#ffb3b3!important}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}#message{min-height:45px;margin-top:30px;font-size:25px;font-weight:700;color:#8ee6ac}button,input{font:inherit}.action{margin:14px auto 0;border:0;border-radius:14px;padding:14px 28px;min-height:50px;font-size:19px;font-weight:700;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}#playAgain{display:none;background:#52d67c;color:#092414}#newGame{display:none;background:#ffd86b;color:#312500}#highScoresButton{background:#7eb8ff;color:#07111f}#backToGame{background:#7eb8ff;color:#07111f}.hint{margin-top:35px;color:#90a8c4;font-size:14px}.screen-hidden{display:none!important}.high-scores{margin:28px auto 0;max-width:520px;background:rgba(0,0,0,.18);border-radius:16px;padding:18px 22px;overflow-x:auto}#highScoresScreen h2{font-size:clamp(32px,8vw,46px);color:#ffd86b;margin:12px 0 16px}#highScoreTable{width:100%;border-collapse:collapse;min-width:390px}#highScoreTable th,#highScoreTable td{padding:10px;border-bottom:1px solid rgba(255,255,255,.12)}#highScoreTable th{color:#a9c8ed;font-size:14px}#highScoreTable td{font-weight:600}
@media(max-width:700px){body{align-items:flex-start}.game{width:100%;min-height:auto;border-radius:18px;padding:22px 14px 28px}h1{font-size:clamp(28px,9vw,40px);line-height:1.05}.subtitle{font-size:16px;margin:10px 0 24px}#stats{gap:8px 15px!important;margin:-8px 0 18px!important;font-size:15px!important}#playerName{width:min(230px,68vw)!important;min-height:44px;font-size:16px!important}.phrase-area{min-height:105px;gap:8px;margin-bottom:28px}.slot{height:48px;min-width:62px!important;padding:0 7px;border-bottom-width:3px;font-size:clamp(16px,4.8vw,22px)}#wordBank{gap:10px}.word{min-height:50px;padding:12px 16px;font-size:clamp(17px,4.7vw,21px)}#message{margin-top:22px;font-size:21px}.action{width:min(280px,92%)}.high-scores{padding:15px 10px;margin-top:22px}.hint{margin-top:25px}}
</style>
</head>
<body>
<main class="game">
<div id="gameScreen">
<h1>Guess the Famous Phrase</h1><div class="subtitle">Click the words in the correct order.</div>
<div style="margin:-22px 0 28px"><label for="playerName" style="font-weight:700;color:#dcecff">Player name: </label><input id="playerName" maxlength="20" placeholder="Enter your name" style="padding:10px 14px;border-radius:10px;border:1px solid #7eb8ff;font-size:17px;width:210px"></div>
<div id="stats" style="display:flex;justify-content:center;gap:28px;flex-wrap:wrap;margin:-25px 0 25px;font-size:18px;font-weight:700;color:#dcecff"><span>Score: <strong id="score">0</strong></span><span>Attempts: <strong id="attempts">0</strong></span><span>Correct: <strong id="correctCount">0</strong></span><span>Wrong: <strong id="wrongCount">0</strong></span><span>Phrases: <strong id="phraseProgress">0 / 5</strong></span></div>
<section id="phraseArea" class="phrase-area"></section><div class="word-bank-title">Choose the next word</div><section id="wordBank"></section><div id="message"></div>
<button id="playAgain" class="action">Next Phrase</button><button id="newGame" class="action">Start New Game</button><button id="highScoresButton" class="action">🏆 High Scores</button>
<div class="hint">Wrong word? You'll hear a beep. Complete the phrase to move on.</div>
</div>
<section id="highScoresScreen" class="screen-hidden"><h2>🏆 High Scores</h2><div class="high-scores"><table id="highScoreTable"><thead><tr><th>Rank</th><th>Player</th><th>Score</th><th>Attempts</th></tr></thead><tbody id="highScoreBody"></tbody></table></div><button id="backToGame" class="action">← Back to Game</button></section>
</main>
<script>
const phrases=["YOU CAN'T HANDLE THE TRUTH","MAY THE FORCE BE WITH YOU","THERE'S NO PLACE LIKE HOME","I'LL BE BACK","TO INFINITY AND BEYOND"];
let phrase=[],currentIndex=0,remainingPhrases=[],completedPhrases=0,score=0,attempts=0,correctCount=0,wrongCount=0,audioContext;
const $=id=>document.getElementById(id),phraseArea=$('phraseArea'),wordBank=$('wordBank'),message=$('message'),playAgain=$('playAgain'),newGame=$('newGame'),playerNameEl=$('playerName'),gameScreen=$('gameScreen'),highScoresScreen=$('highScoresScreen'),highScoreBody=$('highScoreBody');
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function getHighScores(){try{return JSON.parse(localStorage.getItem('famousPhraseHighScores')||'[]')}catch(e){return[]}}function renderHighScores(){const scores=getHighScores();highScoreBody.innerHTML=scores.length?'':'<tr><td colspan="4">No completed games yet</td></tr>';scores.forEach((x,i)=>{const r=document.createElement('tr');r.innerHTML=`<td>${i+1}</td><td>${escapeHtml(x.name||'Player')}</td><td>${x.score}</td><td>${x.attempts}</td>`;highScoreBody.appendChild(r)})}function saveHighScore(){const scores=getHighScores();scores.push({name:playerNameEl.value.trim()||'Player',score,attempts});scores.sort((a,b)=>b.score-a.score||a.attempts-b.attempts);localStorage.setItem('famousPhraseHighScores',JSON.stringify(scores.slice(0,10)));renderHighScores()}function showHighScores(){renderHighScores();gameScreen.classList.add('screen-hidden');highScoresScreen.classList.remove('screen-hidden');scrollTo(0,0)}function showGame(){highScoresScreen.classList.add('screen-hidden');gameScreen.classList.remove('screen-hidden');scrollTo(0,0)}function updateStats(){$('score').textContent=score;$('attempts').textContent=attempts;$('correctCount').textContent=correctCount;$('wrongCount').textContent=wrongCount;$('phraseProgress').textContent=`${completedPhrases} / ${phrases.length}`}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function beep(){try{audioContext=audioContext||new(window.AudioContext||window.webkitAudioContext)();const o=audioContext.createOscillator(),g=audioContext.createGain();o.type='square';o.frequency.value=180;g.gain.setValueAtTime(.12,audioContext.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+.18);o.connect(g);g.connect(audioContext.destination);o.start();o.stop(audioContext.currentTime+.18)}catch(e){}}function startGame(){currentIndex=0;if(!remainingPhrases.length&&!completedPhrases)remainingPhrases=shuffle(phrases);if(!remainingPhrases.length)return;phrase=remainingPhrases.shift().split(' ');phraseArea.innerHTML='';wordBank.innerHTML='';message.textContent='';playAgain.style.display='none';phrase.forEach((w,i)=>{const s=document.createElement('div');s.className='slot';s.id=`slot-${i}`;s.style.minWidth=`${Math.max(92,w.length*22)}px`;phraseArea.appendChild(s)});let mixed=shuffle(phrase);if(mixed.join('|')===phrase.join('|'))mixed=shuffle(phrase);mixed.forEach(w=>{const b=document.createElement('button');b.className='word';b.textContent=w;b.onclick=()=>chooseWord(b,w);wordBank.appendChild(b)})}function chooseWord(b,w){attempts++;if(w===phrase[currentIndex]){correctCount++;score+=10;updateStats();$(`slot-${currentIndex}`).textContent=w;b.disabled=true;currentIndex++;message.textContent='';if(currentIndex===phrase.length){completedPhrases++;updateStats();if(completedPhrases===phrases.length){message.textContent='🎉 Congratulations! You completed all 5 phrases!';playAgain.style.display='none';saveHighScore();newGame.style.display='block'}else{message.textContent='🎉 Correct! You completed the phrase!';playAgain.style.display='block'}}}else{wrongCount++;score=Math.max(0,score-2);updateStats();beep();b.classList.remove('wrong');void b.offsetWidth;b.classList.add('wrong');message.textContent='Try again!';message.style.color='#ff9e9e';setTimeout(()=>{b.classList.remove('wrong');message.textContent='';message.style.color='#8ee6ac'},650)}}function resetGame(){score=attempts=correctCount=wrongCount=completedPhrases=0;remainingPhrases=[];newGame.style.display='none';updateStats();startGame()}
playAgain.onclick=startGame;newGame.onclick=resetGame;$('highScoresButton').onclick=showHighScores;$('backToGame').onclick=showGame;renderHighScores();updateStats();startGame();
</script>
</body></html>
