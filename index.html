<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Guess the Famous Phrase</title>
<meta name="theme-color" content="#07111f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Phrase Game">
<link rel="apple-touch-icon" href="phrase-game-icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(145deg, #10233f, #07111f 70%);
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
  }
  .game {
    width: min(950px, 100%);
    min-height: 590px;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.16);
    border-radius: 24px;
    padding: 36px;
    box-shadow: 0 24px 70px rgba(0,0,0,.38);
    text-align: center;
  }
  h1 { margin: 0 0 8px; font-size: clamp(30px, 5vw, 48px); }
  .subtitle { color: #c7d8ef; margin-bottom: 48px; font-size: 18px; }
  .phrase-area {
    min-height: 145px;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px;
    margin-bottom: 46px;
  }
  .slot {
    height: 62px;
    min-width: 115px;
    padding: 0 14px;
    border-bottom: 4px solid #7eb8ff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
    font-weight: 700;
    letter-spacing: .5px;
    color: #fff;
  }
  .word-bank-title { color: #a9c8ed; margin-bottom: 16px; font-size: 15px; text-transform: uppercase; letter-spacing: 2px; }
  #wordBank { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; min-height: 75px; }
  .word {
    border: 0;
    border-radius: 14px;
    padding: 15px 24px;
    font-size: 21px;
    font-weight: 700;
    color: #10233f;
    background: #f4f8ff;
    cursor: pointer;
    box-shadow: 0 5px 0 #9db5cc;
    transition: transform .08s, background .15s, opacity .15s;
  }
  .word:hover:not(:disabled) { background: #dcecff; transform: translateY(-2px); }
  .word:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 #9db5cc; }
  .word:disabled { opacity: .16; cursor: default; box-shadow: none; }
  .wrong { animation: shake .28s linear; background: #ffb3b3 !important; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
  #message { height: 45px; margin-top: 30px; font-size: 25px; font-weight: 700; color: #8ee6ac; }
  #playAgain {
    display: none;
    margin: 14px auto 0;
    border: 0;
    border-radius: 14px;
    padding: 14px 28px;
    font-size: 19px;
    font-weight: 700;
    background: #52d67c;
    color: #092414;
    cursor: pointer;
  }
  .hint { margin-top: 35px; color: #90a8c4; font-size: 14px; }

  .high-scores { margin: 28px auto 0; max-width: 520px; background: rgba(0,0,0,.18); border-radius: 16px; padding: 18px 22px; }
  .high-scores h2 { margin: 0 0 12px; font-size: 22px; color: #ffd86b; }
  #highScoreTable { width: 100%; border-collapse: collapse; }
  #highScoreTable th, #highScoreTable td { padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,.12); }
  #highScoreTable th { color: #a9c8ed; font-size: 14px; }
  #highScoreTable td { font-weight: 600; }
  #newGame { display:none; margin:14px auto 0; border:0; border-radius:14px; padding:14px 28px; font-size:19px; font-weight:700; background:#ffd86b; color:#312500; cursor:pointer; }

  /* Mobile and iPhone improvements */
  html { -webkit-text-size-adjust: 100%; }
  body { padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); overscroll-behavior: none; }
  button, input { font: inherit; }
  .word, #playAgain, #newGame { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

  @media (max-width: 700px) {
    body { align-items: flex-start; }
    .game {
      width: 100%;
      min-height: auto;
      border-radius: 18px;
      padding: 22px 14px 28px;
      margin: 0;
    }
    h1 { font-size: clamp(28px, 9vw, 40px); line-height: 1.05; }
    .subtitle { font-size: 16px; margin: 10px 0 24px; }
    #stats { gap: 8px 15px !important; margin: -8px 0 18px !important; font-size: 15px !important; }
    #playerName { width: min(230px, 68vw) !important; min-height: 44px; font-size: 16px !important; }
    .phrase-area {
      min-height: 105px;
      gap: 8px;
      margin-bottom: 28px;
      align-content: center;
    }
    .slot {
      height: 48px;
      min-width: 62px !important;
      max-width: 100%;
      padding: 0 7px;
      border-bottom-width: 3px;
      font-size: clamp(16px, 4.8vw, 22px);
    }
    .word-bank-title { margin-bottom: 12px; }
    #wordBank { gap: 10px; }
    .word {
      min-height: 50px;
      padding: 12px 16px;
      font-size: clamp(17px, 4.7vw, 21px);
      flex: 0 1 auto;
    }
    #message { height: auto; min-height: 38px; margin-top: 22px; font-size: 21px; }
    #playAgain, #newGame { min-height: 50px; width: min(280px, 92%); }
    .high-scores { padding: 15px 10px; margin-top: 22px; overflow-x: auto; }
    #highScoreTable { min-width: 390px; }
    #highScoreTable th, #highScoreTable td { padding: 8px 6px; font-size: 14px; }
    .hint { margin-top: 25px; }
  }

  @media (max-width: 390px) {
    .game { padding-left: 10px; padding-right: 10px; }
    .word { padding: 11px 13px; }
    .slot { font-size: 16px; }
  }

</style>
</head>
<body>
<main class="game">
  <h1>Guess the Famous Phrase</h1>
  <div class="subtitle">Click the words in the correct order.</div>
  <div style="margin:-22px 0 28px;">
    <label for="playerName" style="font-weight:700;color:#dcecff;">Player name: </label>
    <input id="playerName" maxlength="20" placeholder="Enter your name" style="padding:10px 14px;border-radius:10px;border:1px solid #7eb8ff;font-size:17px;width:210px;">
  </div>
  <div id="stats" style="display:flex;justify-content:center;gap:28px;flex-wrap:wrap;margin:-25px 0 25px;font-size:18px;font-weight:700;color:#dcecff;">
    <span>Score: <strong id="score">0</strong></span>
    <span>Attempts: <strong id="attempts">0</strong></span>
    <span>Correct: <strong id="correctCount">0</strong></span>
    <span>Wrong: <strong id="wrongCount">0</strong></span>
    <span>Phrases: <strong id="phraseProgress">0 / 25</strong></span>
  </div>
  <section id="phraseArea" class="phrase-area" aria-label="Phrase blanks"></section>
  <div class="word-bank-title">Choose the next word</div>
  <section id="wordBank" aria-label="Jumbled words"></section>
  <div id="message" aria-live="polite"></div>
  <button id="playAgain">Next Phrase</button>
  <button id="newGame">Start New Game</button>
  <div class="high-scores">
    <h2>🏆 High Scores</h2>
    <table id="highScoreTable">
      <thead><tr><th>Rank</th><th>Player</th><th>Score</th><th>Attempts</th></tr></thead>
      <tbody id="highScoreBody"></tbody>
    </table>
  </div>

  <div class="hint">Wrong word? You'll hear a beep. Complete the phrase to move on.</div>
</main>
<script>
const phrases = [
  "YOU CAN'T HANDLE THE TRUTH",
  "MAY THE FORCE BE WITH YOU",
  "THERE'S NO PLACE LIKE HOME",
  "I'LL BE BACK",
  "TO INFINITY AND BEYOND",
  "JUST KEEP SWIMMING",
  "FORTUNE FAVORS THE BOLD",
  "ACTIONS SPEAK LOUDER THAN WORDS",
  "BETTER LATE THAN NEVER",
  "PRACTICE MAKES PERFECT",
  "KNOWLEDGE IS POWER",
  "TIME IS MONEY",
  "EASY COME EASY GO",
  "THE BEST IS YET TO COME",
  "EVERY CLOUD HAS A SILVER LINING",
  "WHEN IN ROME DO AS THE ROMANS DO",
  "HONESTY IS THE BEST POLICY",
  "TWO HEADS ARE BETTER THAN ONE",
  "LOOK BEFORE YOU LEAP",
  "WHERE THERE'S A WILL THERE'S A WAY",
  "THE EARLY BIRD CATCHES THE WORM",
  "ALL THAT GLITTERS IS NOT GOLD",
  "THE PEN IS MIGHTIER THAN THE SWORD",
  "ABSENCE MAKES THE HEART GROW FONDER",
  "A JOURNEY OF A THOUSAND MILES BEGINS WITH A SINGLE STEP"
];
let phrase = [];
let currentIndex = 0;
let remainingPhrases = [];
let completedPhrases = 0;
let score = 0;
let attempts = 0;
let correctCount = 0;
let wrongCount = 0;
let audioContext;

const phraseArea = document.getElementById('phraseArea');
const wordBank = document.getElementById('wordBank');
const message = document.getElementById('message');
const playAgain = document.getElementById('playAgain');
const scoreEl = document.getElementById('score');
const attemptsEl = document.getElementById('attempts');
const correctCountEl = document.getElementById('correctCount');
const wrongCountEl = document.getElementById('wrongCount');
const phraseProgressEl = document.getElementById('phraseProgress');
const highScoreBody = document.getElementById('highScoreBody');
const newGame = document.getElementById('newGame');
const playerNameEl = document.getElementById('playerName');

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

function getHighScores() {
  try { return JSON.parse(localStorage.getItem('famousPhraseHighScores') || '[]'); }
  catch (e) { return []; }
}

function saveHighScore() {
  const scores = getHighScores();
  const name = playerNameEl.value.trim() || 'Player';
  scores.push({ name, score, attempts });
  scores.sort((a,b) => b.score - a.score || a.attempts - b.attempts);
  localStorage.setItem('famousPhraseHighScores', JSON.stringify(scores.slice(0, 10)));
  renderHighScores();
}

function renderHighScores() {
  const scores = getHighScores();
  highScoreBody.innerHTML = scores.length ? '' : '<tr><td colspan="4">No completed games yet</td></tr>';
  scores.forEach((item, i) => {
    const row = document.createElement('tr');
    row.innerHTML = `<td>${i+1}</td><td>${escapeHtml(item.name || 'Player')}</td><td>${item.score}</td><td>${item.attempts}</td>`;
    highScoreBody.appendChild(row);
  });
}

function resetGame() {
  score = 0; attempts = 0; correctCount = 0; wrongCount = 0; completedPhrases = 0;
  remainingPhrases = [];
  newGame.style.display = 'none';
  updateStats();
  startGame();
}


function updateStats() {
  scoreEl.textContent = score;
  attemptsEl.textContent = attempts;
  correctCountEl.textContent = correctCount;
  wrongCountEl.textContent = wrongCount;
  phraseProgressEl.textContent = `${completedPhrases} / ${phrases.length}`;
}

function shuffle(array) {
  const a = [...array];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function beep() {
  try {
    audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();
    osc.type = 'square';
    osc.frequency.value = 180;
    gain.gain.setValueAtTime(0.12, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.18);
    osc.connect(gain);
    gain.connect(audioContext.destination);
    osc.start();
    osc.stop(audioContext.currentTime + 0.18);
  } catch (e) {}
}

function startGame() {
  currentIndex = 0;
  if (remainingPhrases.length === 0 && completedPhrases === 0) {
    remainingPhrases = shuffle(phrases);
  }
  if (remainingPhrases.length === 0) return;
  phrase = remainingPhrases.shift().split(' ');
  phraseArea.innerHTML = '';
  wordBank.innerHTML = '';
  message.textContent = '';
  playAgain.style.display = 'none';

  phrase.forEach((word, i) => {
    const slot = document.createElement('div');
    slot.className = 'slot';
    slot.id = `slot-${i}`;
    slot.style.minWidth = `${Math.max(92, word.length * 22)}px`;
    phraseArea.appendChild(slot);
  });

  let mixed = shuffle(phrase);
  // Avoid beginning with the phrase already in the correct order.
  if (mixed.join('|') === phrase.join('|')) mixed = shuffle(phrase);

  mixed.forEach(word => {
    const btn = document.createElement('button');
    btn.className = 'word';
    btn.textContent = word;
    btn.addEventListener('click', () => chooseWord(btn, word));
    wordBank.appendChild(btn);
  });
}

function chooseWord(button, word) {
  attempts++;
  if (word === phrase[currentIndex]) {
    correctCount++;
    score += 10;
    updateStats();
    document.getElementById(`slot-${currentIndex}`).textContent = word;
    button.disabled = true;
    currentIndex++;
    message.textContent = '';

    if (currentIndex === phrase.length) {
      completedPhrases++;
      updateStats();
      if (completedPhrases === phrases.length) {
        message.textContent = '🎉 Congratulations! You completed all 25 phrases!';
        playAgain.style.display = 'none';
        saveHighScore();
        newGame.style.display = 'block';
      } else {
        message.textContent = '🎉 Correct! You completed the phrase!';
        playAgain.textContent = 'Next Phrase';
        playAgain.style.display = 'block';
      }
    }
  } else {
    wrongCount++;
    score = Math.max(0, score - 2);
    updateStats();
    beep();
    button.classList.remove('wrong');
    void button.offsetWidth;
    button.classList.add('wrong');
    message.textContent = 'Try again!';
    message.style.color = '#ff9e9e';
    setTimeout(() => {
      button.classList.remove('wrong');
      message.textContent = '';
      message.style.color = '#8ee6ac';
    }, 650);
  }
}

playAgain.addEventListener('click', startGame);
newGame.addEventListener('click', resetGame);
renderHighScores();
updateStats();
startGame();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
</body>
</html>
